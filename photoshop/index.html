<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; height: 100vh; color: var(--uxp-host-text-color); font-size: 12px; }
    #top { flex: none; padding: 8px 10px 0; }
    .row { display: flex; gap: 6px; margin: 4px 0; align-items: center; }
    .grow { flex: 1; }
    .hint, .help { opacity: 0.6; font-size: 11px; }
    #status { opacity: 0.75; font-size: 11px; min-height: 14px; margin: 2px 0 6px; }
    #tabs { display: flex; border-bottom: 1px solid var(--uxp-host-border-color); }
    .tab { flex: 1; text-align: center; padding: 6px 0; cursor: pointer; opacity: 0.55; border-bottom: 2px solid transparent; }
    .tab.on { opacity: 1; font-weight: bold; border-bottom-color: var(--uxp-host-text-color); }
    /* Only the controls scroll; buttons, status and tabs stay put. */
    #params { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 10px 12px; }
    .section { margin-top: 10px; padding: 6px 8px 8px; border: 1px solid var(--uxp-host-border-color); border-radius: 4px; }
    .shead { display: flex; align-items: center; gap: 6px; padding-bottom: 2px; }
    .stitle { flex: 1; font-weight: bold; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; opacity: 0.8; }
    .param { margin: 8px 0 0; }
    .param input[type="range"] { width: 100%; }
    .head { display: flex; justify-content: space-between; align-items: center; }
    .num { width: 56px; }
    .dialrow { display: flex; gap: 10px; align-items: center; }
    .dialtext { flex: 1; }
    .dial { position: relative; width: 48px; height: 48px; border-radius: 24px; border: 2px solid var(--uxp-host-text-color); cursor: pointer; }
    .knob { position: absolute; width: 8px; height: 8px; border-radius: 4px; background-color: var(--uxp-host-text-color); }
    .tintbox { display: flex; gap: 6px; align-items: center; }
    .tintbox input { width: 72px; }
    .swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--uxp-host-border-color); }
  </style>
</head>
<body>
  <div id="top">
    <div class="row">
      <sp-button id="make">Make Glass</sp-button>
      <sp-button id="refresh" variant="secondary">Refresh</sp-button>
      <span class="grow"></span>
      <label><input type="checkbox" id="live" checked> Live</label>
    </div>
    <div id="status">Select shape layers, then Make Glass. Add more by selecting a glass plus shapes.</div>
    <div id="tabs"></div>
  </div>
  <div id="params"></div>
  <script src="index.js"></script>
</body>
</html>
