# Builds the Illustrator plug-in and panel for macOS on GitHub's Mac machines.
# The Mac Illustrator SDK isn't public (Adobe's licence forbids redistribution): it is read from the private repo
# named in the ILLUSTRATOR_SDK_REPO variable, through a read-only deploy key stored as the ILLUSTRATOR_SDK_KEY secret.
name: Illustrator for Mac
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["ci/**"] # test builds without a release
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ILLUSTRATOR_SDK_REPO }}
          ssh-key: ${{ secrets.ILLUSTRATOR_SDK_KEY }}
          path: sdk
      - name: Unpack the SDK (Adobe ships it as a .dmg)
        run: |
          mkdir -p sdk-unpacked
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/aisdk sdk/*.dmg
          cp -R /tmp/aisdk/. sdk-unpacked/
          hdiutil detach /tmp/aisdk
          echo "SDK_DIR=$(dirname "$(find sdk-unpacked -type d -name illustratorapi | head -1)")" >> "$GITHUB_ENV"
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: ZXPSignCmd
        run: |
          curl -sSL -o zxpsign https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd
          chmod +x zxpsign
      - name: Build
        run: sh illustrator/build-mac.sh "$SDK_DIR" "$PWD/zxpsign"
      - name: Package
        run: |
          cd dist/mac
          ditto -c -k --keepParent LiquidGlass.aip LiquidGlass-mac.aip.zip
      - uses: actions/upload-artifact@v4
        with:
          name: illustrator-mac
          path: |
            dist/mac/LiquidGlass-mac.aip.zip
            dist/mac/SudoLiquidGlassPanel.zxp
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/mac/SudoLiquidGlassPanel.zxp dist/mac/SudoLiquidGlassPanel-mac.zxp
          gh release upload "$GITHUB_REF_NAME" dist/mac/LiquidGlass-mac.aip.zip dist/mac/SudoLiquidGlassPanel-mac.zxp --clobber
